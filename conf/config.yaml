monitor:
  rate: 5          # seconds

process:
  pid_file: ./../app.pid

security:
  encryption_key: 8FVKXDQxzgdEH8DR8wQPnCo6Ke5IwQ+CYdqdmjmi/Lk=

database:
  driver: sqlite
  path: ./data/vigil.db

https:
  enabled: false
  cert_path: conf/cert.pem
  key_path: conf/key.pem

managed_apps: []

vm:
  localhost_fallback: true

filetransfer:
  enabled: true
  data_dir: ./data/file-transfer
  default_chunk_size: 1048576           # 1MB
  encryption_key: "vigil-file-transfer-change-me"
  roots:                                # allowed browse/landing roots; empty -> user home
    - /                                  # entire filesystem (agent runs as root)

# Docker management configuration.
# Enabled by default (omit or set to true). Set to false to disable.
docker:
  enabled: true
  host: ""                              # optional Docker daemon host override

# Embedded Docker Registry HTTP API V2 server configuration.
# Allows docker login / tag / push / pull against this server.
# Enabled by default. Storage path defaults to ./data/docker/registry if empty.
docker_registry:
  enabled: true
  storage_path: ./data/docker/registry

# Poll mode: outbound-only task pulling for networks that block inbound
# connections. bbx long-polls each upstream, executes tasks (same topic
# serial, different topics parallel) and posts results back.
poll:
  enabled: false
  agent_id: ""                        # defaults to hostname
  defaults:
    long_poll_wait: 25s               # upstream hold time (< gateway idle timeout)
    busy_interval: 500ms
    idle_backoff_max: 10s
    busy_to_idle_empty_polls: 3
    task_timeout: 120s
    max_topics: 32
    queue_buffer: 64
    topic_idle_ttl: 10m
    tls:
      insecure_skip_verify: false
      ca_file: ""
  upstreams: []                       # independent upstream services, e.g.:
  # - name: svc-a
  #   endpoint: https://10.0.0.11:9000  # http:// requires allow_http: true
  #   auth: {username: bbx, password: xxx}
  # - name: svc-b
  #   endpoint: https://10.0.0.12:8080
  #   auth: {username: bbx, password: yyy}
  #   tls: {insecure_skip_verify: true}

# HTTP reverse proxy: static instances start with the server; instances
# created via the API/CLI are persisted in the database and restored on
# restart when their desired state is running.
proxy:
  enabled: false
  instances: []                       # static proxy instances, e.g.:
  # - name: web-internal
  #   listen: 127.0.0.1:8080
  #   target: http://10.0.0.5:9000    # http(s)://host[:port]
  #   whitelist: ["10.0.0.0/8"]       # CIDR | *.suffix | host[:port]; target host is always implied
  #   allow_private: true             # required for loopback/RFC1918/link-local targets
  #   max_body_mb: 0                  # 0 = unlimited request body
  #   header_set: {X-Real-IP: ""}
  #   tls: {enabled: false, cert_path: "", key_path: ""}
  # - name: egress                    # forward proxy: clients name the destination (absolute URI / CONNECT)
  #   mode: forward
  #   listen: 127.0.0.1:3128
  #   whitelist: ["*.corp.local", "10.0.0.0/8"]  # REQUIRED in forward mode; gates every destination
  #   allow_private: true
  # forward mode authenticates clients (Proxy-Authorization) against the
  # auth.username / auth.password super admin above; auth.enabled must be true.
  tunnel:                             # poll-mode proxy_session tunnel (see docs/poll-mode.md)
    enabled: false
    allowed_targets: []               # local policy for tunnel targets, e.g. ["127.0.0.1:9000", "10.0.0.0/8"]
                                      # empty = tunneling refused; the upstream cannot broaden this
    max_sessions: 8
    max_duration_sec: 3600            # hard cap per tunnel session
    max_body_mb: 64
